[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "klaracase"
dynamic = ["version"]
description = "Official Python client for the Klaracase REST API (German court decisions, statutes and citation checks)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SPARQ VENTURES UG", email = "support@klaracase.de" }]
keywords = [
  "klaracase",
  "german law",
  "german case law",
  "rechtsprechung",
  "gesetze",
  "statutes",
  "legal research",
  "citation check",
  "mcp",
  "court decisions",
  "api client",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx2>=2.12,<3"]

[project.urls]
Homepage = "https://klaracase.de/developers?ref=pypi"
Documentation = "https://klaracase.de/docs/api"
Repository = "https://github.com/klaracase/klaracase-python"
Issues = "https://github.com/klaracase/klaracase-python/issues"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pyright>=1.1.390",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.version]
path = "src/klaracase/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/klaracase"]

[tool.hatch.build.targets.sdist]
include = [
  "src/klaracase",
  "tests",
  "examples",
  "scripts",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "PL", "ARG", "T20"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "T20"]
"scripts/**" = ["T20"]
"examples/**" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/klaracase", "tests/typing"]

[tool.pyright]
include = ["src/klaracase", "tests/typing"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# The package imports its own underscore modules and the client internals across files.
reportPrivateUsage = false
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
